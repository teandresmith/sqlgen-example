# Minimal OpenTelemetry collector config for local development. Accepts OTLP
# over gRPC/HTTP from the server and logs metrics to the collector's stdout so
# they are visible with `docker compose logs otel-collector`. Swap the debug
# exporter for a real backend (Prometheus, an OTLP gateway, …) in production.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: normal

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
